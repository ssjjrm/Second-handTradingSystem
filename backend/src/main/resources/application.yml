server:
  port: 8081            # 避开参考项目的 8080，两个项目可同时跑

spring:
  application:
    name: secondhand-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 用环境变量兜底，便于换机器时不改代码
    url: "${DB_URL:jdbc:mysql://127.0.0.1:3306/secondhand_shop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}"
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}

  # 统一日期格式，前端不用再处理时间戳
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  # 文件上传大小上限（发布商品最多传几张图）
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    # 下划线列名 <-> 小驼峰字段（create_time <-> createTime）—— 漏配会报 Unknown column
    map-underscore-to-camel-case: true
    # 开发期把 SQL 打出来，方便排查
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto          # 主键用数据库自增
      # 注意：这里【不配】logic-delete-field：
      #   本项目的表没有 deleted 列，用物理删除。
      #   参考项目配了它却没这一列，是无效配置。

jwt:
  # HS256 要求密钥至少 256 位（32 字节），这里给足长度
  secret: ${JWT_SECRET:secondhand-trading-system-jwt-secret-key-2026-change-me-in-production}
  # token 有效期：24 小时（毫秒）
  expiration: 86400000

upload:
  path: uploads           # 本地目录（相对 backend 运行目录）
  base-url: /uploads      # 对外访问前缀

# ==================== 本项目自己的业务开关 ====================
app:
  review:
    # 商品发布是否需要审核：
    #   true （默认）发布后 status=0 待审核，管理员通过后才出现在前台 —— 正式行为
    #   false        发布后 status=1 直接上架，跳过审核 —— 仅本地测试 / 演示用
    #
    # 两种改法，任选其一：
    #   ① 改这里（要重启后端）
    #   ② 后台在线切换 PUT /api/admin/settings/review?enabled=false（不用重启）
    #      —— 注意：在线切换只存在内存里，重启后回到这里的值
    enabled: true

logging:
  level:
    root: info
    com.secondhand: debug   # 自己写的代码打 debug，方便看流程